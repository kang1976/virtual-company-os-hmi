name: omron_fins_app
description: "Omron CJ2H Direct Mobile Monitor & Trend App"
publish_to: 'none'
version: 2.6.0+22

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.70.2
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  omron_usb_native:
    path: ../packages/omron_usb_native

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/www/
    - assets/www/data/
    - assets/www/data/gmsValves/
    - assets/www/data/gmsSubSequences/
    - assets/www/OPERATION HTML/
    - assets/www/grid/
    - assets/www/modules/

