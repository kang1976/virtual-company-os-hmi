<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GMS 장비 선택</title>
<script>
  // 저장된 테마를 먼저 적용(FOUC 방지). 사용자 지정 테마도 복원. (다른 페이지와 동일)
  (function () {
    try {
      if (localStorage.getItem('plcThemeMode') === 'custom') {
        var c = JSON.parse(localStorage.getItem('plcCustomTheme') || '{}');
        document.documentElement.dataset.theme = c.fallback === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-custom-theme', '1');
        var vars = c.vars || {};
        var css = ':root[data-custom-theme]{' + Object.keys(vars).map(function (k) { return '--' + k + ':' + vars[k]; }).join(';') + '}';
        var el = document.createElement('style'); el.id = '__customTheme'; el.textContent = css;
        document.documentElement.appendChild(el);
      } else {
        document.documentElement.dataset.theme = localStorage.getItem('plcTheme') || 'light';
      }
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  })();
</script>
<script>
  // ── 화면 전체 확대/축소 엔진 ───────────────────────────────────────────────
  (function () {
    var KEY = 'plcUiZoom';
    var MIN = 0.5, MAX = 2.0, STEP = 1.1;
    var PRESETS = [50, 67, 75, 80, 90, 100, 110, 125, 150, 175, 200];
    function clamp(z) { return Math.min(MAX, Math.max(MIN, z)); }
    function current() { return clamp(parseFloat(localStorage.getItem(KEY)) || 1); }

    function syncControl(z) {
      var select = document.getElementById('uiZoomSelect');
      if (!select) return;
      var pct = Math.round(z * 100);
      var opt = select.querySelector('option[value="' + pct + '"]');
      if (!opt) {
        opt = document.createElement('option');
        opt.value = String(pct);
        opt.textContent = pct + '%';
        var inserted = false;
        Array.prototype.forEach.call(select.options, function (o) {
          if (!inserted && Number(o.value) > pct) { select.insertBefore(opt, o); inserted = true; }
        });
        if (!inserted) select.appendChild(opt);
      }
      select.value = String(pct);
    }

    function apply(z) {
      if (!document.body) return;
      if (Math.abs(z - 1) < 0.001) {
        document.body.style.zoom = '';
        document.body.style.height = '';
      } else {
        document.body.style.zoom = String(z);
        document.body.style.height = (100 / z) + 'vh';
      }
      document.documentElement.style.setProperty('--ui-zoom', String(z));
      syncControl(z);
    }

    window.__setUiZoom = function (z) {
      z = clamp(z);
      localStorage.setItem(KEY, String(z));
      apply(z);
      return z;
    };
    window.__getUiZoom = current;

    window.addEventListener('wheel', function (e) {
      if (!e.ctrlKey) return;
      e.preventDefault();
      e.stopPropagation();
      var z = clamp(e.deltaY < 0 ? current() * STEP : current() / STEP);
      window.__setUiZoom(z);
    }, { passive: false, capture: true });

    window.addEventListener('keydown', function (e) {
      if (e.ctrlKey && (e.key === '0' || e.code === 'Digit0' || e.code === 'Numpad0')) {
        e.preventDefault();
        window.__setUiZoom(1);
      }
    });

    function wireControls() {
      var outBtn = document.getElementById('uiZoomOut');
      var inBtn = document.getElementById('uiZoomIn');
      var select = document.getElementById('uiZoomSelect');
      if (outBtn) outBtn.addEventListener('click', function () {
        var pct = Math.round(current() * 100);
        var lower = PRESETS.filter(function (p) { return p < pct; }).pop();
        window.__setUiZoom((lower !== undefined ? lower : Math.max(50, pct - 10)) / 100);
      });
      if (inBtn) inBtn.addEventListener('click', function () {
        var pct = Math.round(current() * 100);
        var higher = PRESETS.filter(function (p) { return p > pct; })[0];
        window.__setUiZoom((higher !== undefined ? higher : Math.min(200, pct + 10)) / 100);
      });
      if (select) select.addEventListener('change', function (e) { window.__setUiZoom(Number(e.target.value) / 100); });
      apply(current());
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', wireControls);
    } else {
      wireControls();
    }
  })();
</script>
<style>
  :root {
    --ui-zoom: 1;
    --bg: #f5f7fa; --panel: #ffffff; --panel-border: #d8dee5; --text: #1c232b; --muted: #5b6672;
    --accent: #1a9b5c; --accent-dim: #cdebd9; --warn: #9a6a00; --warn-bg: #fdf1d9; --warn-text: #6b4a00;

    --primary-text: #0d3d26; --danger-text: #6b1f1f; --send-tag: #2563c9; --hex-text: #7a8794;

  }

    --primary-text: #eafff2; --danger-text: #ffdede; --send-tag: #6fa8ff; --hex-text: #7c8998;
  }
  :root[data-theme='orange'] {
    --bg: #fdf6f0; --panel: #ffffff; --panel-border: #f0d4b4; --text: #2b1d10; --muted: #8a6a4a;
    --accent: #ff8a00; --accent-dim: #ffe3bf; --warn: #b45f00; --warn-bg: #fff1dc; --warn-text: #7a3e00;
    --error: #c23c3c; --input-bg: #fff3e6; --bg-alt: #fff3e6; --flash-bg: #ffedd6; --danger-bg: #fbe4e4;
    --primary-text: #7a3d00; --danger-text: #6b1f1f; --send-tag: #2563c9; --hex-text: #a3805e;
  }
  :root[data-theme='blue'] {
    --bg: #eef4fc; --panel: #ffffff; --panel-border: #c7dbf2; --text: #16233a; --muted: #5c7699;
    --accent: #2f6fed; --accent-dim: #d7e6ff; --warn: #9a6a00; --warn-bg: #fdf1d9; --warn-text: #6b4a00;
    --error: #c23c3c; --input-bg: #e7f0fb; --bg-alt: #e7f0fb; --flash-bg: #dbe9fc; --danger-bg: #fbe4e4;
    --primary-text: #0b3a8a; --danger-text: #6b1f1f; --send-tag: #7c4dff; --hex-text: #7a92b8;
  }
  :root[data-theme='green'] {
    --bg: #eefaf3; --panel: #ffffff; --panel-border: #bfe6d0; --text: #123324; --muted: #4f8067;
    --accent: #16a34a; --accent-dim: #d3f3df; --warn: #9a6a00; --warn-bg: #fdf1d9; --warn-text: #6b4a00;
    --error: #c23c3c; --input-bg: #e6f7ec; --bg-alt: #e6f7ec; --flash-bg: #d7f4e2; --danger-bg: #fbe4e4;
    --primary-text: #0b5c30; --danger-text: #6b1f1f; --send-tag: #2563c9; --hex-text: #6ea183;
  }
  :root[data-theme='gray'] {
    --bg: #f2f3f5; --panel: #ffffff; --panel-border: #d6d9de; --text: #202329; --muted: #63676f;
    --accent: #4b5563; --accent-dim: #e2e4e8; --warn: #9a6a00; --warn-bg: #fdf1d9; --warn-text: #6b4a00;
    --error: #c23c3c; --input-bg: #eceef1; --bg-alt: #eceef1; --flash-bg: #e4e6ea; --danger-bg: #fbe4e4;
    --primary-text: #1f2937; --danger-text: #6b1f1f; --send-tag: #2563c9; --hex-text: #8a8f99;
  }
  /* .mode-modal이 자체 display:flex 규칙을 갖고 있어([hidden]과 동일 명시도), author
     스타일이 user-agent 기본값([hidden]{display:none})을 이겨서 hidden이 무시되는 문제가
     있었다(gms.html에 이미 있던 것과 같은 문제). !important로 hidden이 항상 이기게 한다. */
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px;
  }
  header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    padding: 10px 20px; border-bottom: 1px solid var(--panel-border); background: var(--panel);
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; color: var(--text); white-space: nowrap; }
  /* .page-tabs unified in theme-3d.css */
  select, button, input { background: var(--input-bg); border: 1px solid var(--panel-border); color: var(--text); padding: 6px 10px; border-radius: 4px; font-size: 14px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled, input:disabled, select:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--primary-text); }
  button.danger { background: var(--danger-bg); border-color: var(--error); color: var(--danger-text); }
  button.paused { background: var(--warn-bg); border-color: var(--warn); color: var(--warn-text); }
  input[type=number] { width: 90px; font-family: var(--mono); }

  /* ── 화면 배율 컨트롤(−/%/+) - 모든 페이지 공통 ── */
  .ui-zoom { display: inline-flex; align-items: stretch; border: 1px solid var(--panel-border); border-radius: 6px; overflow: hidden; height: 30px; }
  .ui-zoom button { border: none; background: var(--input-bg); padding: 0 10px; font-size: 15px; font-weight: 700; line-height: 1; cursor: pointer; color: var(--text); border-radius: 0; }
  .ui-zoom button:hover { background: var(--bg-alt); color: var(--accent); }
  .ui-zoom select { border: none; border-left: 1px solid var(--panel-border); border-right: 1px solid var(--panel-border); background: var(--input-bg); font-size: 13px; font-family: var(--mono); color: var(--text); padding: 0 4px; cursor: pointer; border-radius: 0; text-align: center; }

  .conn-toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 20px; border-bottom: 1px solid var(--panel-border); background: var(--bg-alt);
    flex: 0 0 auto;
  }
  .sep { width: 2px; align-self: stretch; background: var(--panel-border); margin: 0 6px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 13px; font-family: var(--mono);
    border: 1px solid var(--panel-border);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status-pill.connected .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-pill.error .dot { background: var(--error); box-shadow: 0 0 6px var(--error); }
  .status-pill.connected { color: var(--accent); border-color: var(--accent-dim); }
  .status-pill.error { color: var(--error); border-color: var(--danger-bg); }
  .counters { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .counters span { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .counters b { display: inline-block; min-width: 3.5ch; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .counters .ok { color: var(--accent); }
  .counters .err { color: var(--error); }

  .poll-toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 20px; border-bottom: 1px solid var(--panel-border); background: var(--panel);
    flex: 0 0 auto;
  }
  .poll-toolbar label { font-size: 13px; color: var(--muted); }

  main { flex: 1 1 auto; overflow: auto; padding: 12px 14px; }
  .select-intro { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }

  .equip-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;
    max-width: 1400px;
  }
  .equip-card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
    cursor: pointer; overflow: hidden; transition: border-color 0.15s, transform 0.1s;
    display: flex; flex-direction: column;
  }
  .equip-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .equip-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .equip-card .equip-values {
    display: flex; justify-content: center; gap: 12px; padding: 10px 8px 4px;
    font-size: 18px; font-weight: 700; font-family: var(--mono); color: var(--text);
  }
  .equip-card .equip-name {
    text-align: center; padding: 0 8px 6px; font-size: 11px; color: var(--muted);
    border-bottom: 1px solid var(--panel-border);
  }
  .equip-card .equip-icon { padding: 8px; display: flex; justify-content: center; background: var(--bg-alt); }
  .equip-card .equip-icon svg { width: 42px; height: 42px; }
  .equip-card .equip-status {
    display: flex; align-items: center; gap: 5px; justify-content: center; padding: 5px 8px;
    font-size: 11px; color: var(--muted); font-family: var(--mono);
  }
  .equip-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .equip-status.online .dot { background: var(--accent); box-shadow: 0 0 5px var(--accent); }
  .equip-status.online { color: var(--accent); }

  .empty-note { color: var(--muted); font-size: 13px; }

  /* ── 장비 세부 화면 진입 모드 선택 팝업 (모니터링/Operation) ── */
  .mode-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 7000; display: flex; align-items: center; justify-content: center; }
  .mode-modal-box { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 18px 20px; min-width: 320px; max-width: 92vw; text-align: center; }
  .mode-modal-box h3 { margin: 0 0 4px; font-size: 16px; color: var(--text); }
  .mode-modal-unit { font-size: 12px; color: var(--accent); font-weight: 700; margin: 0 0 4px; }
  .mode-modal-desc { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  .mode-modal-actions { display: flex; gap: 10px; margin-bottom: 12px; }
  .mode-choice-btn { flex: 1 1 0; display: flex; flex-direction: column; gap: 4px; padding: 12px 10px; border-radius: 8px; border: 1px solid var(--panel-border); background: var(--input-bg); cursor: pointer; text-align: center; }
  .mode-choice-btn:hover { border-color: var(--accent); }
  .mode-choice-btn.primary { background: var(--accent-dim); border-color: var(--accent); }
  .mode-choice-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .mode-choice-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
  .mode-modal-cancel { font-size: 12px; padding: 5px 14px; }

  .log-panel { flex: 0 0 150px; height: 150px; display: flex; flex-direction: column; border-top: 2px solid var(--panel-border); background: var(--panel); }
  .log-panel .log-title { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--panel-border); }
  .log-list { flex: 1; overflow-y: auto; padding: 4px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.6; }
  .log-entry { padding: 2px 0; border-bottom: 1px solid var(--bg-alt); white-space: pre-wrap; word-break: break-all; }
  .log-entry .time { color: var(--muted); }
  .log-entry.SEND .tag { color: var(--send-tag); }
  .log-entry.RECV .tag { color: var(--accent); }
  .log-entry.SYSTEM .tag { color: var(--muted); }
  .log-entry.WARN .tag { color: var(--warn); }
  .log-entry.ERROR .tag { color: var(--error); }
  .log-entry .hex { color: var(--hex-text); display: block; margin-top: 2px; }
  .tag { font-weight: 700; margin-right: 6px; }

  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--accent);
    color: var(--panel); padding: 10px 22px; border-radius: 6px; font-size: 14px; opacity: 0;
    pointer-events: none; transition: opacity 0.25s; z-index: 6000;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--error); color: #fff; }
</style>
<style>
  /* 모바일 웹뷰 또는 작은 화면에서 중복 헤더 숨김 처리 & 컴팩트 No-Scroll 뷰 */
  @media (max-width: 900px) {
    header .page-tabs { display: none !important; }
    header .ui-zoom { display: none !important; }
    header .fullscreen-btn { display: none !important; }
    header { padding: 6px 10px; min-height: auto; }
    header h1 { font-size: 14px; }
    main { padding: 8px 10px; }
    .select-intro { margin: 0 0 6px; font-size: 11px; }
    .equip-grid { gap: 8px; }
    .equip-card .equip-values { padding: 8px 4px 2px; font-size: 16px; gap: 8px; }
    .equip-card .equip-name { padding: 0 4px 4px; font-size: 10px; }
    .equip-card .equip-icon { padding: 6px; }
    .equip-card .equip-icon svg { width: 34px; height: 34px; }
    .equip-card .equip-status { padding: 3px 6px; font-size: 10px; }
  }
  
  /* 통신 및 폴링 설정 아코디언 (접기/펼치기) */
  .accordion-toggle-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 10px;
    background: var(--input-bg);
    border-bottom: 1px solid var(--panel-border);
    font-size: 11px;
    color: var(--muted);
  }
  .accordion-toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 5px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .accordion-toggle-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .conn-accordion-content {
    transition: max-height 0.3s ease, opacity 0.3s ease;
    overflow: hidden;
  }
  .conn-accordion-content.collapsed {
    max-height: 0 !important;
    opacity: 0;
    pointer-events: none;
    border: none !important;
  }
</style>

  <div class="conn-toolbar">
    <select id="plcSeriesSelect" title="PLC 시리즈 선택">
      <option value="CJ" selected>CJ 시리즈</option>
      <option value="NX">NX 시리즈</option>
    </select>
    <input type="text" id="connHost" placeholder="PLC IP (예: 192.168.0.80)" style="width:170px;" value="192.168.0.80" />
    <input type="number" id="connPort" placeholder="Port" min="1" max="65535" value="9600" style="width:80px;" />
    <select id="connType">
      <option value="UDP" selected>UDP (Wi-Fi)</option>
      <option value="USB">USB</option>
      <option value="TCP">TCP</option>
    </select>
    <button id="connectBtn" class="primary">연결</button>
    <button id="disconnectBtn" class="danger" disabled>연결 해제</button>
    <span id="statusPill" class="status-pill"><span class="dot"></span><span id="statusText">연결 안 됨</span></span>
    <span style="font-size:11px;color:var(--warn);margin-left:auto;">⚠️ UDP는 복수 화면 동시 연결 지원</span>
  </div>

  <div class="poll-toolbar">
    <label>폴링주기</label>
    <input type="number" id="gmsIntervalInput" min="200" max="60000" value="1000" style="width:80px;" />
    <span>ms</span>
    <button id="gmsStartBtn" class="primary">▶ 시작</button>
    <button id="gmsPauseBtn">⏸ 일시정지</button>
    <button id="gmsStopBtn" class="danger">⏹ 정지</button>
  </div>
</div>

<main>
  <p class="select-intro">장비를 선택하면 해당 장비의 세부 배관도 화면으로 이동합니다.</p>
  <div id="equipGrid" class="equip-grid"></div>
</main>

<!-- 통신 진단/이력 모달 팝업 -->
<div id="logModal" class="mode-modal" hidden>
  <div class="mode-modal-box" style="width:min(820px, 94vw);max-width:94vw;text-align:left;display:flex;flex-direction:column;height:70vh;">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--panel-border);padding-bottom:10px;margin-bottom:10px;">
      <h3 style="margin:0;font-size:16px;">📡 실시간 통신 진단 및 패킷 이력</h3>
      <button type="button" id="closeLogModalBtn" class="mode-modal-cancel" style="padding:4px 10px;">✕ 닫기</button>
    </div>
    <div style="display:flex;align-items:center;gap:14px;background:var(--bg-alt);padding:8px 12px;border-radius:6px;margin-bottom:10px;" class="counters">
      <span>SEND: <b id="cntSend">0</b></span>
      <span>RECV 성공: <b class="ok" id="cntRecv">0</b></span>
      <span>에러: <b class="err" id="cntErr">0</b></span>
      <span>지연: <b id="cntLatency">—</b></span>
      <button id="resetCountersBtn" style="margin-left:auto;font-size:11px;padding:3px 8px;">카운터 초기화</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span style="font-size:12px;color:var(--muted);">최근 통신 패킷 로그 (최대 300건)</span>
      <div style="display:flex;gap:6px;">
        <button id="filterErrorBtn" style="font-size:11px;padding:3px 8px;">🔴 에러만 보기</button>
        <button id="clearLogBtn" style="font-size:11px;padding:3px 8px;">지우기</button>
      </div>
    </div>
    <div class="log-list" id="logList" style="flex:1;border:1px solid var(--panel-border);border-radius:6px;background:var(--input-bg);padding:8px;overflow-y:auto;"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- 장비 카드를 클릭하면 세부 화면(gms.html)으로 바로 가지 않고, 이 팝업으로 먼저
     "모니터링 Mode"(값만 보기, 밸브 조작·맵 편집 불가) / "Operation Mode"(밸브 조작·맵
     편집 가능) 중 하나를 고르게 한다. 고른 모드는 URL(?mode=)로 gms.html에 전달된다. -->
<div id="modeSelectModal" class="mode-modal" hidden>
  <div class="mode-modal-box">
    <h3>진입 모드 선택</h3>
    <p class="mode-modal-unit" id="modeSelectUnitName"></p>
    <p class="mode-modal-desc">이 장비 화면에 어떤 모드로 들어갈지 선택하세요.</p>
    <div class="mode-modal-actions">
      <button type="button" id="modeMonitorBtn" class="mode-choice-btn">
        <span class="mode-choice-title">모니터링 Mode</span>
        <span class="mode-choice-desc">값 보기 전용<br>밸브 조작 · 맵 편집 불가</span>
      </button>
      <button type="button" id="modeOperationBtn" class="mode-choice-btn primary">
        <span class="mode-choice-title">Operation Mode</span>
        <span class="mode-choice-desc">밸브 조작 가능<br>맵 편집 가능</span>
      </button>
    </div>
    <button type="button" id="modeSelectCancelBtn" class="mode-modal-cancel">취소</button>
  </div>
</div>

<script src="appSettings.js"></script>
<script>window.__plcApiPrefix = '/api/gms';</script>
<script src="gms-select.js"></script>
<script src="clickTracker.js"></script>
</body>
</html>
