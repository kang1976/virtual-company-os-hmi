<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1P Pumping 자동진행 - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "[A/B] 1P 구간 - Pumping" 화면 분리 파일 - Status "1P" 4개
     서브시퀀스(1-2차측 Vent Mode → 2차측 Purge → Pumping → 1차측 Purge) 중 3번째. 2차측
     Purge(ns='onePPurge') 완료 직후 자동으로 시작된다(Operation.js의
     showProgressCylExchangePurgeStep 특수 분기). 서브시퀀스 엑셀 엔진(gms-sub-sequence-runner.js,
     ns='onePPumping')으로 실행 - 실제 내용은 data/gmsSubSequences/OneP3_v1.json. Step 7이
     실제 Pumping 대기 구간으로, CONFIG "PUMPING 시간[분]"만큼 1분 단위로 카운트하며
     HPT_{side} 초기값(최초 도달 시 1회 캡처)/현재값(실시간)을 함께 보여준다. 완료 시
     자동으로 1차측 Purge(onePPrimaryPurge)로 넘어간다. -->
<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <div class="progress-menu-body" id="progressOnePPumpingAutoRunBody">
    <div class="step-badges-lg">
      <span class="step-badge-lg blinking">1P</span>
      <span class="step-badge-lg">-L</span>
      <span class="step-badge-lg" data-vt-badge>-VT</span>
      <span class="step-badge-lg">2P</span>
    </div>

    <div id="onePPumpingIdle">
      <div class="progress-menu-desc">Pumping 구간을 준비하는 중입니다...</div>
      <div class="sub-seq-last-alarm" id="onePPumpingLastAlarm"></div>
      <div class="purge-count-panel" id="onePPumpingIdleCycleInfo" style="display:none;">
        <div class="purge-count-row">
          <span class="purge-count-label">설정시간(분) :</span>
          <span class="purge-count-box">[ <span id="onePPumpingIdleCycleTarget" class="purge-count-value">-</span> ]</span>
        </div>
        <div class="purge-count-row">
          <span class="purge-count-label">진행시간(분) :</span>
          <span class="purge-count-box">[ <span id="onePPumpingIdleCycleCurrent" class="purge-count-value">-</span> ]</span>
        </div>
      </div>
      <div class="progress-btn-group">
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="onePPumpingExecuteBtn" style="margin:0;">실행</button>
          <button type="button" class="progress-aux-btn" id="onePPumpingIdleCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="onePPumpingIdleTrendBtn" style="margin:0;">TREND</button>
        </div>
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="onePPumpingIdleExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="onePPumpingIdleExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="onePPumpingIdleExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>

    <div id="onePPumpingPanel" style="display:none;">
      <div class="sub-seq-step-label" id="onePPumpingStepLabel">Main 1 - Sub 1</div>
      <div class="sub-seq-operation" id="onePPumpingOperation">-</div>
      <div class="sub-seq-message" id="onePPumpingMessage">-</div>
      <div class="sub-seq-valve-diff" id="onePPumpingValveDiff"></div>
      <div class="sub-seq-timer" id="onePPumpingTimer">-</div>
      <div class="sub-seq-acc-time" id="onePPumpingAccTime">누적 경과시간: 0초</div>
      <div class="sub-seq-alarm-banner" id="onePPumpingAlarmBanner" style="display:none;">
        <div class="sub-seq-last-alarm" id="onePPumpingPanelAlarmMsg"></div>
      </div>
      <div class="progress-btn-group">
        <!-- 초기값/현재값(HPT_{side})은 Step 7(Pumping 대기)에 최초 도달했을 때부터 표시된다
             (사용자 요청 - "초기값,현재값,설정시간,진행시간 4개 값을 표현"). 설정/진행시간은
             기존 설정/진행 횟수 표시 메커니즘을 그대로 재사용하되(분 단위로 라벨만 변경),
             초기값/현재값은 gms-sub-sequence-runner.js의 subSeqApplyCapture/
             subSeqRefreshLiveCaptures가 채운다. -->
        <div class="purge-count-panel" id="onePPumpingCycleInfo" style="display:none;">
          <div class="purge-count-row">
            <span class="purge-count-label">초기값(HPT) :</span>
            <span class="purge-count-box">[ <span id="onePPumpingCaptureInitial" class="purge-count-value">-</span> ]</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">현재값(HPT) :</span>
            <span class="purge-count-box">[ <span id="onePPumpingCaptureCurrent" class="purge-count-value">-</span> ]</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">설정시간(분) :</span>
            <span class="purge-count-box">[ <span id="onePPumpingCycleTarget" class="purge-count-value">-</span> ]</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">진행시간(분) :</span>
            <span class="purge-count-box">[ <span id="onePPumpingCycleCurrent" class="purge-count-value">-</span> ]</span>
          </div>
        </div>
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="onePPumpingAckBtn" style="margin:0; display:none;">확인</button>
          <!-- 평소엔 "취소", 알람 배너가 떠 있는 동안엔 "실행"으로 바뀌어 재시작을 담당한다. -->
          <!-- 테스트용 - 카운트다운/누적시간을 그 자리에서 멈추고 남은 시간부터 이어서
               재개할 수 있다(사용자 요청). -->
          <button type="button" class="progress-aux-btn" id="onePPumpingPauseBtn" style="margin:0;">일시정지</button>
          <!-- 테스트 기간 전용 - Step 1부터 즉시 다시 시작한다(사용자 요청). -->
          <button type="button" class="progress-aux-btn" id="onePPumpingResetBtn" style="margin:0;">초기화</button>
          <button type="button" class="progress-aux-btn" id="onePPumpingCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="onePPumpingTrendBtn" style="margin:0;">TREND</button>
        </div>
        <!-- 이 구간(Pumping)에 연결된 서브시퀀스(OneP3_v1)를 엑셀로 내보내서 편집하고,
             편집한 파일을 다시 불러와 그대로 반영한다(gms-sub-sequence-runner.js). -->
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="onePPumpingExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="onePPumpingExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="onePPumpingExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>
  </div>
</body>
</html>
