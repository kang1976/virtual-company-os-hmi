<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VT 감압시험 - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "[A/B] 자동 진행" 화면 분리 파일 - 교환전 실린더 교환 자동 진행
     시퀀스 중 감압시험(-L) 완료 직후, VT 사용 옵션이 적용일 때만 들어오는 "VT 감압 시험"
     화면(Status "-VT", 2차 배관청소(2P) 전 단계). 서브시퀀스 엑셀 엔진(gms-sub-sequence-runner.js,
     ns='vtTest')으로 실행 - 실제 내용은 data/gmsSubSequences/VtTest_v1.json(사용자가 첨부한
     실제 플로우차트 기준 3단계: ①VT Process Pumping(단순 시간대기) ②VT 1/2차측 Pumping+진공
     상한 판정(실 알람) ③VT 점검/누출시험(초기값 캡처 후 :CAPOFFSET로 허용 변동폭 이내인지
     실 알람 판정)). "초기값/현재값"은 3단계에서만 채워진다. "설정 값"은 지금 감시 중인
     Step의 비교 기준(2단계엔 진공 상한, 3단계엔 초기값+누출허용범위)을 그대로 보여준다.
     완료 시 자동으로 다음 Status(2P)로 넘어간다. -->
<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <div class="progress-menu-body" id="progressExchangeVtTestBody">
    <div class="step-badges-lg">
      <span class="step-badge-lg done">1P</span>
      <span class="step-badge-lg done">-L</span>
      <span class="step-badge-lg blinking" data-vt-badge>-VT</span>
      <span class="step-badge-lg">2P</span>
    </div>

    <div id="exchangeVtTestIdle">
      <div class="progress-menu-desc">VT 감압 시험 구간을 준비하는 중입니다...</div>
      <div class="sub-seq-last-alarm" id="exchangeVtTestLastAlarm"></div>
      <div class="purge-count-panel" id="exchangeVtTestIdleCycleInfo" style="display:none;">
        <div class="purge-count-row">
          <span class="purge-count-label">설정시간(분) :</span>
          <span class="purge-count-box">[ <span id="exchangeVtTestIdleCycleTarget" class="purge-count-value">-</span> ]</span>
        </div>
        <div class="purge-count-row">
          <span class="purge-count-label">진행시간(분) :</span>
          <span class="purge-count-box">[ <span id="exchangeVtTestIdleCycleCurrent" class="purge-count-value">-</span> ]</span>
        </div>
      </div>
      <div class="progress-btn-group">
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="exchangeVtTestExecuteBtn" style="margin:0;">실행</button>
          <button type="button" class="progress-aux-btn" id="exchangeVtTestIdleCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="exchangeVtTestIdleTrendBtn" style="margin:0;">TREND</button>
        </div>
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="exchangeVtTestIdleExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="exchangeVtTestIdleExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="exchangeVtTestIdleExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>

    <div id="exchangeVtTestPanel" style="display:none;">
      <div class="sub-seq-step-label" id="exchangeVtTestStepLabel">Main 1 - Sub 1</div>
      <div class="sub-seq-operation" id="exchangeVtTestOperation">-</div>
      <div class="sub-seq-message" id="exchangeVtTestMessage">-</div>
      <div class="sub-seq-valve-diff" id="exchangeVtTestValveDiff"></div>
      <div class="sub-seq-timer" id="exchangeVtTestTimer">-</div>
      <div class="sub-seq-acc-time" id="exchangeVtTestAccTime">누적 경과시간: 0초</div>
      <div class="sub-seq-alarm-banner" id="exchangeVtTestAlarmBanner" style="display:none;">
        <div class="sub-seq-last-alarm" id="exchangeVtTestPanelAlarmMsg"></div>
      </div>
      <div class="progress-btn-group">
        <div class="purge-count-panel" id="exchangeVtTestCycleInfo" style="display:none;">
          <div class="purge-count-row">
            <span class="purge-count-label">설정시간(분) :</span>
            <span class="purge-count-box">[ <span id="exchangeVtTestCycleTarget" class="purge-count-value">-</span> ]</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">진행시간(분) :</span>
            <span class="purge-count-box">[ <span id="exchangeVtTestCycleCurrent" class="purge-count-value">-</span> ]</span>
          </div>
        </div>
        <!-- 초기값/현재값(VT_{side})은 3단계(VT 점검/누출시험, Step 21)에 도달했을 때부터
             표시된다. "설정 값"은 지금 감시 중인 Step의 비교 기준을 그대로 보여준다
             (subSeqSetSettingValue - 2단계엔 진공 상한, 3단계엔 초기값+누출허용범위). -->
        <div class="purge-count-panel value-panel">
          <div class="purge-count-row">
            <span class="purge-count-label">설정 값 :</span>
            <span class="purge-count-box">[ <span id="exchangeVtTestSetValue" class="purge-count-value" style="min-width:44px;">0.000</span> ] Torr</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">초기 값 :</span>
            <span class="purge-count-box initial-value">[ <span id="exchangeVtTestInitialValue" class="purge-count-value" style="min-width:44px;">--</span> ] Torr</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">현재 값 :</span>
            <span class="purge-count-box current-value">[ <span id="exchangeVtTestCurrentValue" class="purge-count-value" style="min-width:44px;">--</span> ] Torr</span>
          </div>
        </div>
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="exchangeVtTestAckBtn" style="margin:0; display:none;">확인</button>
          <!-- 평소엔 "취소", 알람 배너가 떠 있는 동안엔 "실행"으로 바뀌어 재시작을 담당한다. -->
          <!-- 테스트용 - 카운트다운/누적시간을 그 자리에서 멈추고 남은 시간부터 이어서
               재개할 수 있다. -->
          <button type="button" class="progress-aux-btn" id="exchangeVtTestPauseBtn" style="margin:0;">일시정지</button>
          <!-- 테스트 기간 전용 - Step 1부터 즉시 다시 시작한다(사용자 요청). -->
          <button type="button" class="progress-aux-btn" id="exchangeVtTestResetBtn" style="margin:0;">초기화</button>
          <button type="button" class="progress-aux-btn" id="exchangeVtTestCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="exchangeVtTestTrendBtn" style="margin:0;">TREND</button>
        </div>
        <!-- 이 구간(VT 감압시험)에 연결된 서브시퀀스(VtTest_v1)를 엑셀로 내보내서 편집하고,
             편집한 파일을 다시 불러와 그대로 반영한다(gms-sub-sequence-runner.js). -->
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="exchangeVtTestExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="exchangeVtTestExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="exchangeVtTestExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>
  </div>
</body>
</html>
