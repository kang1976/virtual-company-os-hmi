<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2차 배관청소 - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "[A/B] 2차 배관청소" 화면 분리 파일 - Status "2P". 감압시험(-L, 또는
     VT 사용 옵션 적용 시 -VT) 완료 직후 자동으로 시작된다(Operation.js의
     showProgressCylExchangePurgeStep 특수 분기). 서브시퀀스 엑셀 엔진(gms-sub-sequence-runner.js,
     ns='twoP')으로 실행 - 실제 내용은 data/gmsSubSequences/TwoP_v1.json(배관진공 확인 → N2 Purge →
     예약어 '진행횟수'로 CONFIG "교환전 2차 퍼지진행 횟수"만큼 반복, 1P 구간의 1차측
     Purge(OneP4_v1)와 완전히 동일한 구조). 완료 시 PASSWORD("실린더 교체") 확인 후 다음
     Status(CC, 용기교체)로 넘어간다. -->
<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <div class="progress-menu-body" id="progressExchangeSecondPurgeBody">
    <div class="step-badges-lg">
      <span class="step-badge-lg done">1P</span>
      <span class="step-badge-lg done">-L</span>
      <span class="step-badge-lg done" data-vt-badge>-VT</span>
      <span class="step-badge-lg blinking">2P</span>
    </div>

    <div id="exchangeSecondPurgeIdle">
      <div class="progress-menu-desc">2차 배관청소 구간을 준비하는 중입니다...</div>
      <div class="sub-seq-last-alarm" id="exchangeSecondPurgeLastAlarm"></div>
      <div class="purge-count-panel" id="exchangeSecondPurgeIdleCycleInfo" style="display:none;">
        <div class="purge-count-row">
          <span class="purge-count-label">설정 횟수 :</span>
          <span class="purge-count-box">[ <span id="exchangeSecondPurgeIdleCycleTarget" class="purge-count-value">-</span> ]</span>
        </div>
        <div class="purge-count-row">
          <span class="purge-count-label">진행 횟수 :</span>
          <span class="purge-count-box">[ <span id="exchangeSecondPurgeIdleCycleCurrent" class="purge-count-value">-</span> ]</span>
        </div>
      </div>
      <div class="progress-btn-group">
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="exchangeSecondPurgeExecuteBtn" style="margin:0;">실행</button>
          <button type="button" class="progress-aux-btn" id="exchangeSecondPurgeIdleCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="exchangeSecondPurgeIdleTrendBtn" style="margin:0;">TREND</button>
        </div>
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="exchangeSecondPurgeIdleExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="exchangeSecondPurgeIdleExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="exchangeSecondPurgeIdleExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>

    <div id="exchangeSecondPurgePanel" style="display:none;">
      <div class="sub-seq-step-label" id="exchangeSecondPurgeStepLabel">Main 1 - Sub 1</div>
      <div class="sub-seq-operation" id="exchangeSecondPurgeOperation">-</div>
      <div class="sub-seq-message" id="exchangeSecondPurgeMessage">-</div>
      <div class="sub-seq-valve-diff" id="exchangeSecondPurgeValveDiff"></div>
      <div class="sub-seq-timer" id="exchangeSecondPurgeTimer">-</div>
      <div class="sub-seq-acc-time" id="exchangeSecondPurgeAccTime">누적 경과시간: 0초</div>
      <div class="sub-seq-alarm-banner" id="exchangeSecondPurgeAlarmBanner" style="display:none;">
        <div class="sub-seq-last-alarm" id="exchangeSecondPurgePanelAlarmMsg"></div>
      </div>
      <div class="progress-btn-group">
        <div class="purge-count-panel" id="exchangeSecondPurgeCycleInfo" style="display:none;">
          <div class="purge-count-row">
            <span class="purge-count-label">설정 횟수 :</span>
            <span class="purge-count-box">[ <span id="exchangeSecondPurgeCycleTarget" class="purge-count-value">-</span> ]</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">진행 횟수 :</span>
            <span class="purge-count-box">[ <span id="exchangeSecondPurgeCycleCurrent" class="purge-count-value">-</span> ]</span>
          </div>
        </div>
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="exchangeSecondPurgeAckBtn" style="margin:0; display:none;">확인</button>
          <!-- 평소엔 "취소", 알람 배너가 떠 있는 동안엔 "실행"으로 바뀌어 재시작을 담당한다. -->
          <!-- 테스트용 - 카운트다운/누적시간을 그 자리에서 멈추고 남은 시간부터 이어서
               재개할 수 있다(사용자 요청). -->
          <button type="button" class="progress-aux-btn" id="exchangeSecondPurgePauseBtn" style="margin:0;">일시정지</button>
          <!-- 테스트 기간 전용 - Step 1부터 즉시 다시 시작한다(사용자 요청). -->
          <button type="button" class="progress-aux-btn" id="exchangeSecondPurgeResetBtn" style="margin:0;">초기화</button>
          <button type="button" class="progress-aux-btn" id="exchangeSecondPurgeCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="exchangeSecondPurgeTrendBtn" style="margin:0;">TREND</button>
        </div>
        <!-- 이 구간(2차 배관청소)에 연결된 서브시퀀스(TwoP_v1)를 엑셀로 내보내서 편집하고,
             편집한 파일을 다시 불러와 그대로 반영한다(gms-sub-sequence-runner.js). -->
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="exchangeSecondPurgeExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="exchangeSecondPurgeExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="exchangeSecondPurgeExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>
  </div>
</body>
</html>
