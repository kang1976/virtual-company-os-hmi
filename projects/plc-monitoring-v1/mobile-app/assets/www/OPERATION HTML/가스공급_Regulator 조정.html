<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Regulator 조정 - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "[A/B] 자동 진행" 화면 분리 파일 - 가스공급 자동 진행 다섯 번째
     화면(Cylinder open 다음). 참고 사진 기준 대각선 두 분면(좌상/우하)이 열림(초록), 나머지
     두 분면은 닫힘(검정) - .valve-turn-icon(../gms.css) 참고. 실제 로직은 아직 없음(뼈대) -
     "확인"은 다음 화면(PMV open 확인)으로, "취소"는 가스공급 진입 지점(PC/가스공급 화면)
     으로 되돌아간다. 스타일은 ../gms.css를 그대로 참조(복사 아님). gms.js가 fetch해서
     id="progressGasSupplyRegulatorAdjustBody" 컨테이너에 주입한다. -->
<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <div class="progress-menu-body" id="progressGasSupplyRegulatorAdjustBody">
    <div class="valve-turn-icon">
      <div class="valve-turn-blade tl open"></div>
      <div class="valve-turn-blade tr"></div>
      <div class="valve-turn-blade bl"></div>
      <div class="valve-turn-blade br open"></div>
      <div class="valve-turn-label">확 인</div>
    </div>
    <div class="progress-menu-desc">Regulator를<br>조정하여 주십시오!</div>
    <div class="progress-btn-group">
      <div style="display:flex;gap:10px;">
        <button type="button" class="progress-btn" id="gasSupplyRegulatorAdjustConfirmBtn" style="flex:1;margin-bottom:0;">확인</button>
        <button type="button" class="progress-aux-btn" id="gasSupplyRegulatorAdjustCancelBtn" style="flex:1;margin-top:0;">취소</button>
      </div>
    </div>
  </div>
</body>
</html>
