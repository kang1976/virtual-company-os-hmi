<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1P 2차측 Purge 자동진행 - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "[A/B] 1P 구간 - 2차측 Purge" 화면 분리 파일 - Status "1P" 4개
     서브시퀀스(1-2차측 Vent Mode → 2차측 Purge → Pumping → 1차측 Purge) 중 2번째. 1-2차측
     Vent Mode(ns='oneP') 완료 직후 자동으로 시작된다(Operation.js의
     showProgressCylExchangePurgeStep 특수 분기). 서브시퀀스 엑셀 엔진(gms-sub-sequence-runner.js,
     ns='onePPurge')으로 실행 - 실제 내용은 data/gmsSubSequences/OneP2_v1.json(아직 뼈대,
     밸브/조건 미정). 완료 시 자동으로 Pumping(onePPumping)으로 넘어간다. -->
<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <div class="progress-menu-body" id="progressOnePPurgeAutoRunBody">
    <div class="step-badges-lg">
      <span class="step-badge-lg blinking">1P</span>
      <span class="step-badge-lg">-L</span>
      <span class="step-badge-lg" data-vt-badge>-VT</span>
      <span class="step-badge-lg">2P</span>
    </div>

    <div id="onePPurgeIdle">
      <div class="progress-menu-desc">2차측 Purge 구간을 준비하는 중입니다...</div>
      <div class="sub-seq-last-alarm" id="onePPurgeLastAlarm"></div>
      <div class="purge-count-panel" id="onePPurgeIdleCycleInfo" style="display:none;">
        <div class="purge-count-row">
          <span class="purge-count-label">설정 횟수 :</span>
          <span class="purge-count-box">[ <span id="onePPurgeIdleCycleTarget" class="purge-count-value">-</span> ]</span>
        </div>
        <div class="purge-count-row">
          <span class="purge-count-label">진행 횟수 :</span>
          <span class="purge-count-box">[ <span id="onePPurgeIdleCycleCurrent" class="purge-count-value">-</span> ]</span>
        </div>
      </div>
      <div class="progress-btn-group">
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="onePPurgeExecuteBtn" style="margin:0;">실행</button>
          <button type="button" class="progress-aux-btn" id="onePPurgeIdleCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="onePPurgeIdleTrendBtn" style="margin:0;">TREND</button>
        </div>
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="onePPurgeIdleExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="onePPurgeIdleExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="onePPurgeIdleExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>

    <div id="onePPurgePanel" style="display:none;">
      <div class="sub-seq-step-label" id="onePPurgeStepLabel">Main 1 - Sub 1</div>
      <div class="sub-seq-operation" id="onePPurgeOperation">-</div>
      <div class="sub-seq-message" id="onePPurgeMessage">-</div>
      <div class="sub-seq-valve-diff" id="onePPurgeValveDiff"></div>
      <div class="sub-seq-timer" id="onePPurgeTimer">-</div>
      <div class="sub-seq-acc-time" id="onePPurgeAccTime">누적 경과시간: 0초</div>
      <div class="sub-seq-alarm-banner" id="onePPurgeAlarmBanner" style="display:none;">
        <div class="sub-seq-last-alarm" id="onePPurgePanelAlarmMsg"></div>
      </div>
      <div class="progress-btn-group">
        <div class="purge-count-panel" id="onePPurgeCycleInfo" style="display:none;">
          <div class="purge-count-row">
            <span class="purge-count-label">설정 횟수 :</span>
            <span class="purge-count-box">[ <span id="onePPurgeCycleTarget" class="purge-count-value">-</span> ]</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">진행 횟수 :</span>
            <span class="purge-count-box">[ <span id="onePPurgeCycleCurrent" class="purge-count-value">-</span> ]</span>
          </div>
        </div>
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="onePPurgeAckBtn" style="margin:0; display:none;">확인</button>
          <!-- 평소엔 "취소", 알람 배너가 떠 있는 동안엔 "실행"으로 바뀌어 재시작을 담당한다. -->
          <!-- 테스트용 - 카운트다운/누적시간을 그 자리에서 멈추고 남은 시간부터 이어서
               재개할 수 있다(사용자 요청). -->
          <button type="button" class="progress-aux-btn" id="onePPurgePauseBtn" style="margin:0;">일시정지</button>
          <!-- 테스트 기간 전용 - Step 1부터 즉시 다시 시작한다(사용자 요청). -->
          <button type="button" class="progress-aux-btn" id="onePPurgeResetBtn" style="margin:0;">초기화</button>
          <button type="button" class="progress-aux-btn" id="onePPurgeCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="onePPurgeTrendBtn" style="margin:0;">TREND</button>
        </div>
        <!-- 이 구간(2차측 Purge)에 연결된 서브시퀀스(OneP2_v1)를 엑셀로 내보내서 편집하고,
             편집한 파일을 다시 불러와 그대로 반영한다(gms-sub-sequence-runner.js). -->
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="onePPurgeExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="onePPurgeExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="onePPurgeExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>
  </div>
</body>
</html>
