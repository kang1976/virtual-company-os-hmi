<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Regulator Close - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "[A/B] 자동 진행" 화면 분리 파일 - 가스공급 자동 진행 세 번째
     화면(Valve shutter 장착 다음). 밸브를 돌리라는 안내는 참고 사진 속 4분면 팬휠 아이콘
     (.valve-turn-icon, ../gms.css)으로 표시 - Regulator Close는 전부 잠그는 단계라 네
     분면 모두 닫힘(검정)이다(다른 가스공급 밸브 안내 화면들은 열린 정도에 따라 초록
     분면이 늘어난다). 실제 로직은 아직 없음(뼈대) - "확인"은 다음 화면(Cylinder open)으로,
     "취소"는 가스공급 진입 지점(PC/가스공급 화면)으로 되돌아간다. 스타일은 ../gms.css를
     그대로 참조(복사 아님). gms.js가 fetch해서 id="progressGasSupplyRegulatorCloseBody"
     컨테이너에 주입한다. -->
<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <div class="progress-menu-body" id="progressGasSupplyRegulatorCloseBody">
    <div class="valve-turn-icon">
      <div class="valve-turn-blade tl"></div>
      <div class="valve-turn-blade tr"></div>
      <div class="valve-turn-blade bl"></div>
      <div class="valve-turn-blade br"></div>
      <div class="valve-turn-label">확 인</div>
    </div>
    <div class="progress-menu-desc">Regulator를 잠궈주세요!</div>
    <div class="progress-btn-group">
      <div style="display:flex;gap:10px;">
        <button type="button" class="progress-btn" id="gasSupplyRegulatorCloseConfirmBtn" style="flex:1;margin-bottom:0;">확인</button>
        <button type="button" class="progress-aux-btn" id="gasSupplyRegulatorCloseCancelBtn" style="flex:1;margin-top:0;">취소</button>
      </div>
    </div>
  </div>
</body>
</html>
