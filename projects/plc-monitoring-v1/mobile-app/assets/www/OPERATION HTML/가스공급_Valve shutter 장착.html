<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valve shutter 장착 - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "[A/B] 자동 진행" 화면 분리 파일 - 가스공급 자동 진행 두 번째
     화면(공급 압력 확인 다음). 실제 로직은 아직 없음(뼈대) - "확인"은 다음 화면(Regulator
     Close)으로, "취소"는 가스공급 진입 지점(PC/가스공급 화면)으로 되돌아간다. 스타일은
     ../gms.css를 그대로 참조(복사 아님). gms.js가 fetch해서
     id="progressGasSupplyValveShutterBody" 컨테이너에 주입한다. -->
<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <div class="progress-menu-body" id="progressGasSupplyValveShutterBody">
    <div class="barcode-check-title">[ Valve shutter 장착 ]</div>
    <div class="progress-menu-desc" style="margin-top:20px;">Gas Turn-On을 진행하고자 합니다.</div>
    <div class="progress-menu-desc">실린더에 Valve Shutter를 장착 하신 후<br>고정용 Bolt의 체결 상태를<br>확인하시기 바랍니다.</div>
    <div class="progress-btn-group">
      <div style="display:flex;gap:10px;">
        <button type="button" class="progress-btn" id="gasSupplyValveShutterConfirmBtn" style="flex:1;margin-bottom:0;">확인</button>
        <button type="button" class="progress-aux-btn" id="gasSupplyValveShutterCancelBtn" style="flex:1;margin-top:0;">취소</button>
      </div>
    </div>
  </div>
</body>
</html>
