<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PASSWORD - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "PASSWORD" 입력 화면 분리 파일. 스타일은 ../gms.css를 그대로
     참조(복사 아님). gms.js가 fetch해서 id="progressPasswordBody" 컨테이너에 주입한다. -->
<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <!-- "유지 보수" 클릭 시 나타나는 비밀번호 입력 화면 - 메뉴얼 흐름
       [메인 메뉴] → [Password 입력] → [유지보수 메뉴] 중 두 번째 단계.
       실제 검증 로직은 아직 없음(뼈대) - 자릿수 입력/지우기/취소만 실제로 동작한다.
       passwordContextLabel: "지금 어떤 상황에서 PASSWORD를 요구하는지"를 안내 문구 바로
       위에 보여준다(예: "[A] 유지보수" / "[A] 수동 밸브 조작 취소") - Operation.js의
       showProgressPassword()가 매번 채워 넣는다. -->
  <div class="progress-menu-body" id="progressPasswordBody">
    <div class="progress-menu-desc password-context-label" id="passwordContextLabel"></div>
    <div class="progress-menu-desc">비밀번호를 입력하십시오.</div>
    <!-- 키패드+확인/취소 묶음도 프레임 맨 아래에 붙는다(공통 규칙). -->
    <div class="progress-btn-group">
      <div class="password-display" id="passwordDisplay"><span class="placeholder">PASSWORD</span></div>
      <div class="password-keypad">
        <button type="button" class="keypad-btn" data-digit="1">1</button>
        <button type="button" class="keypad-btn" data-digit="2">2</button>
        <button type="button" class="keypad-btn" data-digit="3">3</button>
        <button type="button" class="keypad-btn" data-digit="4">4</button>
        <button type="button" class="keypad-btn" data-digit="5">5</button>
        <button type="button" class="keypad-btn" data-digit="6">6</button>
        <button type="button" class="keypad-btn" data-digit="7">7</button>
        <button type="button" class="keypad-btn" data-digit="8">8</button>
        <button type="button" class="keypad-btn" data-digit="9">9</button>
        <button type="button" class="keypad-btn keypad-aux" id="passwordClearBtn">CLR</button>
        <button type="button" class="keypad-btn" data-digit="0">0</button>
        <button type="button" class="keypad-btn keypad-aux" id="passwordBackBtn">⌫</button>
      </div>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button type="button" class="progress-aux-btn" id="passwordCancelBtn" style="flex:1;">취소</button>
        <button type="button" class="progress-btn" id="passwordConfirmBtn" style="flex:1;margin-bottom:0;">확인</button>
      </div>
    </div>
  </div>
</body>
</html>
