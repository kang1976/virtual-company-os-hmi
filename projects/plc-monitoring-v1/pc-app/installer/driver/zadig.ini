# PLC 모니터링 설치 프로그램이 자동으로 넣어주는 설정 - Zadig을 열자마자
# "모든 장치 보기" + "WinUSB 기본 선택" 상태로 시작하게 해서, 사용자는 목록에서
# OMRON SYSMAC PLC Device를 고르고 [Install Driver]만 누르면 되도록 한다.

[general]
  advanced_mode = true
  exit_on_success = false
  log_level = 2

[device]
  list_all = true
  include_hubs = false
  trim_whitespaces = true

[driver]
  default_driver = 0
  extract_only = false
