<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1P 1차측 Purge 자동진행 - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "[A/B] 1P 구간 - 1차측 Purge" 화면 분리 파일 - Status "1P" 4개
     서브시퀀스(1-2차측 Vent Mode → 2차측 Purge → Pumping → 1차측 Purge) 중 마지막(4번째).
     Pumping(ns='onePPumping') 완료 직후 자동으로 시작된다(Operation.js의
     showProgressCylExchangePurgeStep 특수 분기). 서브시퀀스 엑셀 엔진(gms-sub-sequence-runner.js,
     ns='onePPrimaryPurge')으로 실행 - 실제 내용은 data/gmsSubSequences/OneP4_v1.json(배관진공
     확인 → N2 Purge → 예약어 '진행횟수'로 CONFIG "교환전 1차 퍼지진행 횟수"만큼 반복,
     2차측 Purge와 동일 패턴). 완료 시 1P 구간 전체가 끝나 Status가 -L(감압시험)로 넘어간다. -->
<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <div class="progress-menu-body" id="progressOnePPrimaryPurgeAutoRunBody">
    <div class="step-badges-lg">
      <span class="step-badge-lg blinking">1P</span>
      <span class="step-badge-lg">-L</span>
      <span class="step-badge-lg" data-vt-badge>-VT</span>
      <span class="step-badge-lg">2P</span>
    </div>

    <div id="onePPrimaryPurgeIdle">
      <div class="progress-menu-desc">1차측 Purge 구간을 준비하는 중입니다...</div>
      <div class="sub-seq-last-alarm" id="onePPrimaryPurgeLastAlarm"></div>
      <div class="purge-count-panel" id="onePPrimaryPurgeIdleCycleInfo" style="display:none;">
        <div class="purge-count-row">
          <span class="purge-count-label">설정 횟수 :</span>
          <span class="purge-count-box">[ <span id="onePPrimaryPurgeIdleCycleTarget" class="purge-count-value">-</span> ]</span>
        </div>
        <div class="purge-count-row">
          <span class="purge-count-label">진행 횟수 :</span>
          <span class="purge-count-box">[ <span id="onePPrimaryPurgeIdleCycleCurrent" class="purge-count-value">-</span> ]</span>
        </div>
      </div>
      <div class="progress-btn-group">
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="onePPrimaryPurgeExecuteBtn" style="margin:0;">실행</button>
          <button type="button" class="progress-aux-btn" id="onePPrimaryPurgeIdleCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="onePPrimaryPurgeIdleTrendBtn" style="margin:0;">TREND</button>
        </div>
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="onePPrimaryPurgeIdleExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="onePPrimaryPurgeIdleExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="onePPrimaryPurgeIdleExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>

    <div id="onePPrimaryPurgePanel" style="display:none;">
      <div class="sub-seq-step-label" id="onePPrimaryPurgeStepLabel">Main 1 - Sub 1</div>
      <div class="sub-seq-operation" id="onePPrimaryPurgeOperation">-</div>
      <div class="sub-seq-message" id="onePPrimaryPurgeMessage">-</div>
      <div class="sub-seq-valve-diff" id="onePPrimaryPurgeValveDiff"></div>
      <div class="sub-seq-timer" id="onePPrimaryPurgeTimer">-</div>
      <div class="sub-seq-acc-time" id="onePPrimaryPurgeAccTime">누적 경과시간: 0초</div>
      <div class="sub-seq-alarm-banner" id="onePPrimaryPurgeAlarmBanner" style="display:none;">
        <div class="sub-seq-last-alarm" id="onePPrimaryPurgePanelAlarmMsg"></div>
      </div>
      <div class="progress-btn-group">
        <div class="purge-count-panel" id="onePPrimaryPurgeCycleInfo" style="display:none;">
          <div class="purge-count-row">
            <span class="purge-count-label">설정 횟수 :</span>
            <span class="purge-count-box">[ <span id="onePPrimaryPurgeCycleTarget" class="purge-count-value">-</span> ]</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">진행 횟수 :</span>
            <span class="purge-count-box">[ <span id="onePPrimaryPurgeCycleCurrent" class="purge-count-value">-</span> ]</span>
          </div>
        </div>
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="onePPrimaryPurgeAckBtn" style="margin:0; display:none;">확인</button>
          <!-- 평소엔 "취소", 알람 배너가 떠 있는 동안엔 "실행"으로 바뀌어 재시작을 담당한다. -->
          <!-- 테스트용 - 카운트다운/누적시간을 그 자리에서 멈추고 남은 시간부터 이어서
               재개할 수 있다(사용자 요청). -->
          <button type="button" class="progress-aux-btn" id="onePPrimaryPurgePauseBtn" style="margin:0;">일시정지</button>
          <!-- 테스트 기간 전용 - Step 1부터 즉시 다시 시작한다(사용자 요청). -->
          <button type="button" class="progress-aux-btn" id="onePPrimaryPurgeResetBtn" style="margin:0;">초기화</button>
          <button type="button" class="progress-aux-btn" id="onePPrimaryPurgeCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="onePPrimaryPurgeTrendBtn" style="margin:0;">TREND</button>
        </div>
        <!-- 이 구간(1차측 Purge)에 연결된 서브시퀀스(OneP4_v1)를 엑셀로 내보내서 편집하고,
             편집한 파일을 다시 불러와 그대로 반영한다(gms-sub-sequence-runner.js). -->
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="onePPrimaryPurgeExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="onePPrimaryPurgeExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="onePPrimaryPurgeExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>
  </div>
</body>
</html>
