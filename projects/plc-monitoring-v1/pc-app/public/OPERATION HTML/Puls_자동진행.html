<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Puls 자동진행 - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "[A/B] Puls 구간" 화면 분리 파일 - Status "Puls"(잔류가스 Check,
     Pulse Vent 2단계)의 실제 화면. 실린더 잠금 check 화면의 IDLE 사전확인 7단계(ns='idleCheck')
     완료 직후 자동으로 시작된다(Operation.js의 showProgressCylExchangePurgeStep 특수 분기).
     서브시퀀스 엑셀 엔진(gms-sub-sequence-runner.js, ns='puls')으로 실행 - 실제 2단계 내용은
     data/gmsSubSequences/Puls_v1.json. 사용자 확인(실사 HMI 참고 자료) 결과 1P 배지는
     Puls 구간부터 이미 점멸한다(1P 큰 배지가 Puls/1P 두 Status에 걸쳐 공유됨) - CYLINDER
     STEP STATUS 패널의 작은 배지에는 "Puls"가 별도로 표시된다. -->

<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <div class="progress-menu-body" id="progressPulsAutoRunBody">
    <div class="step-badges-lg">
      <span class="step-badge-lg blinking">1P</span>
      <span class="step-badge-lg">-L</span>
      <span class="step-badge-lg" data-vt-badge>-VT</span>
      <span class="step-badge-lg">2P</span>
    </div>

    <div id="pulsRunIdle">
      <div class="progress-menu-desc">Puls 구간을 준비하는 중입니다...</div>
      <div class="sub-seq-last-alarm" id="pulsRunLastAlarm"></div>
      <!-- 알람으로 초기화되면 여기 idle로 돌아오는데, 진행 횟수가 몇 회까지 갔었는지도
           알람 메시지와 함께 그대로 보여야 한다(사용자 요청 - "진행횟수 유지하고 알람
           메시지만 띄우면 됩니다"). subSeqHandleAlarm이 알람 발생 시점의 값을 그대로
           복사해 넣는다(라이브 갱신 아님 - "실행"을 다시 눌러 새로 시작하기 전까지 고정). -->
      <div class="purge-count-panel" id="pulsRunIdleCycleInfo" style="display:none;">
        <div class="purge-count-row">
          <span class="purge-count-label">설정 횟수 :</span>
          <span class="purge-count-box">[ <span id="pulsRunIdleCycleTarget" class="purge-count-value">-</span> ]</span>
        </div>
        <div class="purge-count-row">
          <span class="purge-count-label">진행 횟수 :</span>
          <span class="purge-count-box">[ <span id="pulsRunIdleCycleCurrent" class="purge-count-value">-</span> ]</span>
        </div>
      </div>
      <!-- 버튼 배치를 조정모드 idle(실행/취소/압력조정 + 엑셀 내보내기/불러오기 2줄)과
           통일한다(사용자 요청 - "실행 key 하나만 있음, 첫번째 아래 버튼처럼 배치"). -->
      <div class="progress-btn-group">
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="pulsRunExecuteBtn" style="margin:0;">실행</button>
          <button type="button" class="progress-aux-btn" id="pulsRunIdleCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="pulsRunIdleTrendBtn" style="margin:0;">TREND</button>
        </div>
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="pulsRunIdleExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="pulsRunIdleExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="pulsRunIdleExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>

    <div id="pulsRunPanel" style="display:none;">
      <div class="sub-seq-step-label" id="pulsRunStepLabel">Main 1 - Sub 1</div>
      <div class="sub-seq-operation" id="pulsRunOperation">-</div>
      <div class="sub-seq-message" id="pulsRunMessage">-</div>
      <div class="sub-seq-valve-diff" id="pulsRunValveDiff"></div>
      <div class="sub-seq-timer" id="pulsRunTimer">-</div>
      <div class="sub-seq-acc-time" id="pulsRunAccTime">누적 경과시간: 0초</div>
      <!-- 알람 배너 - 알람이 나도 화면을 idle로 바꾸지 않고 지금 보던 패널(Step 정보)을
           그대로 둔 채 이 배너(메시지만)만 추가로 띄운다(사용자 요청 - "화면 변경없이 기존
           화면에 알람 메세지만 추가로"). 재진행은 별도 확인 버튼이 아니라 하단 "취소" 자리가
           알람 중엔 "실행"으로 바뀌어 담당한다(사용자 요청 - "확인 key를 삭제하시고, 하단
           버튼에 취소를 실행으로 변경"). -->
      <div class="sub-seq-alarm-banner" id="pulsRunAlarmBanner" style="display:none;">
        <div class="sub-seq-last-alarm" id="pulsRunPanelAlarmMsg"></div>
      </div>
      <div class="progress-btn-group">
        <!-- 설정/진행 횟수 - 다른 화면들의 뼈대(예: 교환전2P_2차 배관청소.html)와 같은
             .purge-count-panel 박스 스타일로 통일한다(사용자 요청). .progress-btn-group
             안(조작 버튼 바로 위)에 둬서 버튼과 함께 화면 맨 아래로 붙는다(사용자 요청 -
             원래는 margin-top:auto인 버튼 그룹보다 위, 즉 콘텐츠 쪽에 남아 버튼과 떨어져
             있었다). 값은 입력칸이 아니라 읽기전용 표시(설정 횟수는 CONFIG "Puls vent
             설정횟수"에서, 진행 횟수는 실행 중 실시간으로 채워진다) - id는 기존과 동일해서
             JS(subSeqRenderCycleStatus) 변경 없이 그대로 값이 들어간다. -->
        <div class="purge-count-panel" id="pulsRunCycleInfo" style="display:none;">
          <div class="purge-count-row">
            <span class="purge-count-label">설정 횟수 :</span>
            <span class="purge-count-box">[ <span id="pulsRunCycleTarget" class="purge-count-value">-</span> ]</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">진행 횟수 :</span>
            <span class="purge-count-box">[ <span id="pulsRunCycleCurrent" class="purge-count-value">-</span> ]</span>
          </div>
        </div>
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="pulsRunAckBtn" style="margin:0; display:none;">확인</button>
          <!-- 평소엔 "취소"(진행 중 중단), 알람 배너가 떠 있는 동안엔 "실행"으로 바뀌어
               서브시퀀스를 다시 시작한다(subSeqWireOnce의 stopBtn 핸들러가 subSeqAlarmActive[ns]로
               분기). -->
          <!-- 테스트용 - 카운트다운/누적시간을 그 자리에서 멈추고 남은 시간부터 이어서
               재개할 수 있다(사용자 요청). -->
          <button type="button" class="progress-aux-btn" id="pulsRunPauseBtn" style="margin:0;">일시정지</button>
          <!-- 테스트 기간 전용 - Step 1부터 즉시 다시 시작한다(사용자 요청). -->
          <button type="button" class="progress-aux-btn" id="pulsRunResetBtn" style="margin:0;">초기화</button>
          <button type="button" class="progress-aux-btn" id="pulsRunCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="pulsRunTrendBtn" style="margin:0;">TREND</button>
        </div>
        <!-- 이 구간(Puls)에 연결된 서브시퀀스(Puls_v1)를 엑셀로 내보내서 편집하고, 편집한
             파일을 다시 불러와 그대로 반영한다(gms-sub-sequence-runner.js). -->
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="pulsRunExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="pulsRunExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="pulsRunExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>
  </div>
</body>
</html>
