<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>감압시험 - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "[A/B] 교환전-L 감압시험" 화면 분리 파일 - Status "1P" 완료 직후
     자동으로 시작된다(Operation.js의 showProgressCylExchangePurgeStep 특수 분기). 서브시퀀스
     엑셀 엔진(gms-sub-sequence-runner.js, ns='exchangePressureTest')으로 실행 - 1P
     Pumping(OneP3_v1.json)과 완전히 같은 디자인/패턴(값 캡처 + 분 단위 진행시간 + 초 단위
     실시간 표시)이다. 실제 내용은 data/gmsSubSequences/ExchL_v1.json(아직 뼈대, 밸브/조건
     미정 - "서브시퀀스 엑셀 내보내기"로 받아 채운 뒤 "불러오기"로 반영). 완료 시
     advanceToNextEnabledStatus로 다음 Status(VT 사용 옵션에 따라 -VT 또는 2P)로 넘어간다. -->
<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <div class="progress-menu-body" id="progressExchangePressureTestBody">
    <div class="step-badges-lg">
      <span class="step-badge-lg done">1P</span>
      <span class="step-badge-lg blinking">-L</span>
      <span class="step-badge-lg" data-vt-badge>-VT</span>
      <span class="step-badge-lg">2P</span>
    </div>

    <div id="exchangePressureTestIdle">
      <div class="progress-menu-desc">감압시험 구간을 준비하는 중입니다...</div>
      <div class="sub-seq-last-alarm" id="exchangePressureTestLastAlarm"></div>
      <div class="purge-count-panel" id="exchangePressureTestIdleCycleInfo" style="display:none;">
        <div class="purge-count-row">
          <span class="purge-count-label">설정시간(분) :</span>
          <span class="purge-count-box">[ <span id="exchangePressureTestIdleCycleTarget" class="purge-count-value">-</span> ]</span>
        </div>
        <div class="purge-count-row">
          <span class="purge-count-label">진행시간(분) :</span>
          <span class="purge-count-box">[ <span id="exchangePressureTestIdleCycleCurrent" class="purge-count-value">-</span> ]</span>
        </div>
      </div>
      <div class="progress-btn-group">
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="exchangePressureTestExecuteBtn" style="margin:0;">실행</button>
          <button type="button" class="progress-aux-btn" id="exchangePressureTestIdleCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="exchangePressureTestIdleTrendBtn" style="margin:0;">TREND</button>
        </div>
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="exchangePressureTestIdleExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="exchangePressureTestIdleExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="exchangePressureTestIdleExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>

    <div id="exchangePressureTestPanel" style="display:none;">
      <div class="sub-seq-step-label" id="exchangePressureTestStepLabel">Main 1 - Sub 1</div>
      <div class="sub-seq-operation" id="exchangePressureTestOperation">-</div>
      <div class="sub-seq-message" id="exchangePressureTestMessage">-</div>
      <div class="sub-seq-valve-diff" id="exchangePressureTestValveDiff"></div>
      <div class="sub-seq-timer" id="exchangePressureTestTimer">-</div>
      <div class="sub-seq-acc-time" id="exchangePressureTestAccTime">누적 경과시간: 0초</div>
      <div class="sub-seq-alarm-banner" id="exchangePressureTestAlarmBanner" style="display:none;">
        <div class="sub-seq-last-alarm" id="exchangePressureTestPanelAlarmMsg"></div>
      </div>
      <div class="progress-btn-group">
        <!-- 초기값/현재값(HPT_{side})은 Step 2(감압시험 대기)에 최초 도달했을 때부터
             표시된다(1P Pumping 화면과 동일한 구성). -->
        <div class="purge-count-panel" id="exchangePressureTestCycleInfo" style="display:none;">
          <div class="purge-count-row">
            <span class="purge-count-label" id="exchangePressureTestInitialLabel">초기값(HPT) :</span>
            <span class="purge-count-box">[ <span id="exchangePressureTestCaptureInitial" class="purge-count-value">-</span> ]</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label" id="exchangePressureTestCurrentLabel">현재값(HPT) :</span>
            <span class="purge-count-box">[ <span id="exchangePressureTestCaptureCurrent" class="purge-count-value">-</span> ]</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">압력변동기준 :</span>
            <span class="purge-count-box">[ <span id="exchangePressureTestCaptureLimit" class="purge-count-value">-</span> ]</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">설정시간(분) :</span>
            <span class="purge-count-box">[ <span id="exchangePressureTestCycleTarget" class="purge-count-value">-</span> ]</span>
          </div>
          <div class="purge-count-row">
            <span class="purge-count-label">진행시간(분) :</span>
            <span class="purge-count-box">[ <span id="exchangePressureTestCycleCurrent" class="purge-count-value">-</span> ]</span>
          </div>
        </div>
        <div class="adjust-mode-actions">
          <button type="button" class="progress-btn" id="exchangePressureTestAckBtn" style="margin:0; display:none;">확인</button>
          <!-- 평소엔 "취소", 알람 배너가 떠 있는 동안엔 "실행"으로 바뀌어 재시작을 담당한다. -->
          <!-- 테스트용 - 카운트다운/누적시간을 그 자리에서 멈추고 남은 시간부터 이어서
               재개할 수 있다. -->
          <button type="button" class="progress-aux-btn" id="exchangePressureTestPauseBtn" style="margin:0;">일시정지</button>
          <!-- 테스트 기간 전용 - Step 1부터 즉시 다시 시작한다(사용자 요청). -->
          <button type="button" class="progress-aux-btn" id="exchangePressureTestResetBtn" style="margin:0;">초기화</button>
          <button type="button" class="progress-aux-btn" id="exchangePressureTestCancelBtn" style="margin:0;">취소</button>
          <button type="button" class="progress-aux-btn" id="exchangePressureTestTrendBtn" style="margin:0;">TREND</button>
        </div>
        <!-- 이 구간(-L 감압시험)에 연결된 서브시퀀스(ExchL_v1)를 엑셀로 내보내서 편집하고,
             편집한 파일을 다시 불러와 그대로 반영한다(gms-sub-sequence-runner.js). -->
        <div class="adjust-mode-actions" style="margin-top:8px;">
          <button type="button" class="progress-aux-btn" id="exchangePressureTestExcelExportBtn" style="margin:0;">서브시퀀스 엑셀 내보내기</button>
          <button type="button" class="progress-aux-btn" id="exchangePressureTestExcelImportBtn" style="margin:0;">서브시퀀스 엑셀 불러오기</button>
        </div>
        <input type="file" id="exchangePressureTestExcelFileInput" accept=".xlsx" style="display:none;" />
      </div>
    </div>
  </div>
</body>
</html>
