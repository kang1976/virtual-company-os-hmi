<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Auto Guard 확인(Open) - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "[A/B] 자동 진행" 화면 분리 파일 - 용기교체(Status "CC") 6단계 중
     세 번째, "Valve Open 확인" 다음. 실린더 분리 전 Auto Guard가 Open 되어 있는지 확인하는
     화면 - 뒤에 나오는 "Auto Guard 확인(Close)"과 이름은 같지만 파일/컨테이너는 분리해
     둔다(문구·역할이 다름). 화면 진입 시 Operation.js의 applyCcStepValves가
     CylReplace_v1.json Step3을 읽어 SVG 배관도의 AG_{side} 아이콘에 Open 상태를 반영한다
     (텍스트 배지 아님) - "확인"은 다음 화면(실린더 분리 및 교체)으로, "취소"는 용기교체를
     그만두고 Status를 2P로 되돌린 뒤
     실린더 잠금 check로 나간다. 스타일은 ../gms.css를 그대로 참조(복사 아님). gms.js가
     fetch해서 id="progressCylReplaceAutoGuardOpenBody" 컨테이너에 주입한다. -->
<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <div class="progress-menu-body" id="progressCylReplaceAutoGuardOpenBody">
    <div class="barcode-check-title">[ Auto Guard 확인 ]</div>
    <div class="progress-menu-desc">실린더 교체전<br>Auto Guard가 Open<br>되었는지 확인해<br>주시기 바랍니다.</div>
    <div class="progress-btn-group">
      <div style="display:flex;gap:10px;">
        <button type="button" class="progress-btn" id="cylReplaceAutoGuardOpenConfirmBtn" style="flex:1;margin-bottom:0;">확인</button>
        <button type="button" class="progress-aux-btn" id="cylReplaceAutoGuardOpenCancelBtn" style="flex:1;margin-top:0;">취소</button>
      </div>
    </div>
  </div>
</body>
</html>
