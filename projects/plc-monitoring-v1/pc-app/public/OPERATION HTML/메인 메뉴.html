<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>메인 메뉴 - GMS 조작화면</title>
<!-- gms.html 조작화면 중 "[A/B] 메인 메뉴" 화면 분리 파일. 스타일은 ../gms.css를 그대로
     참조(복사 아님). gms.js가 fetch해서 id="progressMainMenuBody" 컨테이너에 주입한다. -->
<link rel="stylesheet" href="../gms.css">
</head>
<body>
  <!-- "A 진행"/"B 진행" 클릭 시 나타나는 하위 메뉴 - 순간정전 매뉴얼의 "[A] 메인 메뉴"
       화면 구성을 그대로 따른다(가스공급/실린더 교환/반대쪽 선택/유지보수/TREND).
       실제 동작 로직은 아직 없음 - 화면 전환(취소/"반대쪽" 선택)만 실제로 동작한다. -->
  <div class="progress-menu-body" id="progressMainMenuBody">
    <div class="progress-menu-desc">진행할 메뉴를 선택 하십시오!</div>
    <!-- 버튼 묶음은 프레임 맨 아래에 붙는다(margin-top:auto) - 조작화면의 모든
         하위 화면 공통 규칙, root 화면(progressRootBody)과 동일 패턴. -->
    <div class="progress-btn-group">
      <button type="button" class="progress-btn" id="mainMenuCylinderExchangeBtn" data-action="실린더 교환">실린더 교환</button>
      <button type="button" class="progress-btn" id="mainMenuSwitchSideBtn">"B" 선택</button>
      <button type="button" class="progress-btn" id="mainMenuMaintenanceEntryBtn" data-action="유지 보수">유지 보수</button>
      <button type="button" class="progress-btn" id="mainMenuTrendBtn" data-action="TREND">TREND</button>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button type="button" class="progress-aux-btn" id="mainMenuAuxBtn" style="flex:1;">보조 메뉴</button>
        <button type="button" class="progress-aux-btn" id="mainMenuCancelBtn" style="flex:1;">취소</button>
      </div>
    </div>
  </div>
</body>
</html>
